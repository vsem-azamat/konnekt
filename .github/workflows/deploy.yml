name: Deploy

on:
  push:
    branches: [main]
  # Deploy a release that was already built, to go back without waiting for a
  # revert to pass the pipeline. Its images exist because main built them.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main whose images to deploy
        required: true
        type: string
      migrate:
        # Off to go back past a migration: the older alembic does not know the
        # newer revision. Migrations are expand-only for a release, so the
        # older code reads the newer schema (docs/invariants.md).
        description: Run the app's and the catalog's migrations
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-main
  # Never cut a deploy off: between stopping the catalog's old database and
  # starting its new one there is no catalog. The next push waits instead.
  cancel-in-progress: false

jobs:
  # The lanes the merged pull request already passed on this very tree, which
  # the tests below leave out; any doubt leaves out none.
  tested:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      lanes: ${{ steps.lookup.outputs.lanes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lanes the merged pull request passed on this tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/tested_lanes.sh | tee -a "$GITHUB_OUTPUT"

  test:
    needs: tested
    # Not skipped when the lookup failed: its empty answer runs every lane.
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
    uses: ./.github/workflows/test.yml
    with:
      tested: ${{ needs.tested.outputs.lanes }}

  build-and-push:
    needs: test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/vsem-azamat/supervisor-telegram:${{ github.sha }}
          # A scope per image: in one shared scope each export replaced the
          # other's, so neither found its layers and every deploy rebuilt and
          # re-pulled the whole virtualenv.
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      - name: Build and push webui
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: webui
          build-args: WEB_VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/vsem-azamat/supervisor-telegram-webui:${{ github.sha }}
          cache-from: type=gha,scope=webui
          cache-to: type=gha,mode=max,scope=webui

      # A tag of the same public package rather than a package of its own: a
      # new package starts private, and the host pulls without a login.
      - name: Build and push the catalog
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: catalog
          target: runtime
          push: true
          tags: |
            ghcr.io/vsem-azamat/supervisor-telegram:catalog-${{ github.sha }}
          cache-from: type=gha,scope=catalog
          cache-to: type=gha,mode=max,scope=catalog

  deploy:
    needs: build-and-push
    # Reads the repository and nothing else; its power is the SSH key, which
    # a token able to write would only add to.
    permissions:
      contents: read
    # A dispatch skips the build, and a skipped need would skip this too.
    if: ${{ !cancelled() && (needs.build-and-push.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Above the SSH session's own 30 minutes, so that one ends first and says why.
    timeout-minutes: 40

    steps:
      # The compose file of the release being deployed, not of main's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      # Before anything reaches the host, whose compose file the next step
      # overwrites: a dispatched sha must be a release main built.
      - name: The release to deploy is one of main's, with its images published
        if: github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ inputs.sha }}
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "sha must be a full 40-character commit id" >&2; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main" >&2; exit 1; }
          for image in supervisor-telegram:"$SHA" supervisor-telegram-webui:"$SHA" supervisor-telegram:catalog-"$SHA"; do
            docker buildx imagetools inspect "ghcr.io/vsem-azamat/$image" > /dev/null \
              || { echo "no published image $image" >&2; exit 1; }
          done

      # Fails before anything reaches the VPS. The settings below have no
      # defaults, so a deploy missing one starts containers that crash on
      # boot; the rest would come up quietly wrong instead, which is worse.
      - name: Check required configuration is present
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MODERATOR_BOT_TOKEN: ${{ secrets.MODERATOR_BOT_TOKEN }}
          ADMIN_SUPER_ADMINS: ${{ secrets.ADMIN_SUPER_ADMINS }}
          WEBAPI_PUBLIC_URL: ${{ vars.WEBAPI_PUBLIC_URL }}
          CATALOG_DB_USER: ${{ secrets.CATALOG_DB_USER }}
          CATALOG_DB_NAME: ${{ secrets.CATALOG_DB_NAME }}
          CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
          OBSERVABILITY_METRICS_SECRET: ${{ secrets.OBSERVABILITY_METRICS_SECRET }}
        run: |
          missing=""

          # No defaults worth having: the database is not part of this stack, so
          # a missing host silently means localhost, and the containers come up
          # pointing at nothing.
          # The catalog's database credentials are the ones its data was
          # created with, and WEBAPI_PUBLIC_URL is where its buttons and
          # notifications open the app: neither has a default that could work.
          for name in DB_HOST DB_USER DB_NAME DB_PASSWORD MODERATOR_BOT_TOKEN ADMIN_SUPER_ADMINS WEBAPI_PUBLIC_URL CATALOG_DB_USER CATALOG_DB_NAME CATALOG_DB_PASSWORD; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done

          # Optional, but a short one stops all three processes at import, which
          # would otherwise show only after the old stack is down and migrated.
          if [ -n "$OBSERVABILITY_METRICS_SECRET" ] && [ "${#OBSERVABILITY_METRICS_SECRET}" -lt 32 ]; then
            echo "OBSERVABILITY_METRICS_SECRET must be 32 characters or more, or unset." >&2
            exit 1
          fi

          if [ -n "$missing" ]; then
            echo "Missing required configuration:$missing" >&2
            echo "Set them as repository secrets or variables." >&2
            exit 1
          fi
          echo "Required configuration present."

      # The console's host for Caddy, from the same URL the webapi reads.
      # Refuses one that would take the Mini App's traffic or match nothing.
      - name: Work out the console's host
        id: admin_host
        env:
          WEBAPI_ADMIN_URL: ${{ vars.WEBAPI_ADMIN_URL }}
          WEBAPI_PUBLIC_URL: ${{ vars.WEBAPI_PUBLIC_URL }}
        # Its own line: an assignment's failure ends the step (bash -e), where the
        # same call inside `echo "$(...)"` would pass with an empty host.
        run: |
          host=$(bash scripts/admin_host.sh "$WEBAPI_ADMIN_URL" "$WEBAPI_PUBLIC_URL")
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yaml
          target: ~/deploy/supervisor-telegram/

      # Configuration travels with the command and is never written to the host.
      # Secrets hold credentials; variables hold everything else that differs
      # between environments. Anything not listed falls back to the default in
      # app/core/config.py — the list is not a second copy of every setting, and
      # a test pins it against docker-compose.yaml so the two cannot drift.
      - name: Deploy on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_TAG: ${{ inputs.sha || github.sha }}
          MIGRATE: ${{ github.event_name != 'workflow_dispatch' || inputs.migrate }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MODERATOR_BOT_TOKEN: ${{ secrets.MODERATOR_BOT_TOKEN }}
          ADMIN_SUPER_ADMINS: ${{ secrets.ADMIN_SUPER_ADMINS }}
          ADMIN_REPORT_CHAT_ID: ${{ secrets.ADMIN_REPORT_CHAT_ID }}
          WEBAPI_PUBLIC_URL: ${{ vars.WEBAPI_PUBLIC_URL }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          # The browser's sign-in (app/webapi/routes/auth_telegram.py): all three, or none.
          WEBAPI_ADMIN_URL: ${{ vars.WEBAPI_ADMIN_URL }}
          ADMIN_HOST: ${{ steps.admin_host.outputs.host }}
          WEBAPI_OIDC_CLIENT_ID: ${{ vars.WEBAPI_OIDC_CLIENT_ID }}
          WEBAPI_OIDC_CLIENT_SECRET: ${{ secrets.WEBAPI_OIDC_CLIENT_SECRET }}
          # The retired bots' tokens, comma-separated (app/presentation/telegram/moved.py).
          MODERATOR_BOT_RETIRED_TOKEN: ${{ secrets.MODERATOR_BOT_RETIRED_TOKEN }}
          # A file_id or https URL for the /start video (app/core/config.py); unset, text only.
          MODERATOR_BOT_INTRO_VIDEO: ${{ vars.MODERATOR_BOT_INTRO_VIDEO }}
          # The ads contact desk, @konnekt_ads_bot (app/presentation/telegram/ads.py).
          ADS_BOT_TOKEN: ${{ secrets.ADS_BOT_TOKEN }}
          ADS_BOT_GROUP_ID: ${{ secrets.ADS_BOT_GROUP_ID }}
          ADS_BOT_NAME: ${{ vars.ADS_BOT_NAME }}
          CATALOG_DB_USER: ${{ secrets.CATALOG_DB_USER }}
          CATALOG_DB_NAME: ${{ secrets.CATALOG_DB_NAME }}
          CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
          CATALOG_OWNER_TG_ID: ${{ secrets.CATALOG_OWNER_TG_ID }}
          CATALOG_ADS_CONTACT: ${{ vars.CATALOG_ADS_CONTACT }}
          # Between webapi and the catalog alone (catalog/docs/architecture.md).
          CATALOG_SERVICE_TOKEN: ${{ secrets.CATALOG_SERVICE_TOKEN }}
          OBSERVABILITY_METRICS_SECRET: ${{ secrets.OBSERVABILITY_METRICS_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Pull, migrate, embed and wait: more than the default ten minutes
          # on a slow day, and a session cut off midway leaves no catalog.
          command_timeout: 30m
          envs: IMAGE_TAG,MIGRATE,DB_HOST,DB_PORT,DB_USER,DB_NAME,DB_PASSWORD,MODERATOR_BOT_TOKEN,ADMIN_SUPER_ADMINS,ADMIN_REPORT_CHAT_ID,WEBAPI_PUBLIC_URL,MCP_TOKEN,WEBAPI_ADMIN_URL,ADMIN_HOST,WEBAPI_OIDC_CLIENT_ID,WEBAPI_OIDC_CLIENT_SECRET,MODERATOR_BOT_RETIRED_TOKEN,MODERATOR_BOT_INTRO_VIDEO,ADS_BOT_TOKEN,ADS_BOT_GROUP_ID,ADS_BOT_NAME,CATALOG_DB_USER,CATALOG_DB_NAME,CATALOG_DB_PASSWORD,CATALOG_OWNER_TG_ID,CATALOG_ADS_CONTACT,CATALOG_SERVICE_TOKEN,OBSERVABILITY_METRICS_SECRET
          script: |
            set -e
            cd ~/deploy/supervisor-telegram

            # Pull as nobody. Both images are public, so no credential is
            # needed — and a stale one is worse than none, because the registry
            # rejects what it is shown instead of falling back to anonymous.
            # That is how every pull started failing with "denied" while the
            # images were readable by anyone.
            #
            # The host is shared with unrelated projects, so clearing its
            # ghcr.io login is not ours to do. A config directory of our own
            # sidesteps whichever user or credential helper holds the bad
            # entry, and has nothing in it that could expire later.
            export DOCKER_CONFIG="$PWD/.docker"
            mkdir -p "$DOCKER_CONFIG"

            # The release running now, kept after this one replaces it so that
            # going back to it needs no pull.
            PREVIOUS_TAG=$(docker inspect -f '{{.Config.Image}}' supervisor-telegram-bot 2>/dev/null | sed -n 's/^.*://p')

            docker compose pull

            # The catalog's password, proven against whichever Postgres holds
            # its data now, before anything is stopped: pg_isready does not
            # authenticate, and a wrong one would otherwise surface only at the
            # migration, with the old catalog already down.
            holders=$(docker ps --format '{{.Names}}' --filter volume=konnekt_postgres-data)
            [ -n "$holders" ] || echo "Nothing holds the catalog's database; the password is proven by the migration."
            # Line by line rather than `for x in $list`: the deploy user's login
            # shell is zsh, which does not split an unquoted variable into words.
            printf '%s\n' "$holders" | grep . | while read -r holder; do
              network=$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' "$holder" | awk '{print $1}')
              # Named, not given a value: the value would sit in docker's argv.
              PGPASSWORD="$CATALOG_DB_PASSWORD" docker run --rm --network "$network" -e PGPASSWORD \
                pgvector/pgvector:0.8.6-pg18-bookworm \
                psql -h "$holder" -U "$CATALOG_DB_USER" -d "$CATALOG_DB_NAME" -tAc 'select 1' > /dev/null 2>&1 \
                || { echo "CATALOG_DB_* do not open the catalog database on $holder" >&2; exit 1; }
            done

            # Two Postgres servers on one data directory corrupt it, and the
            # catalog's volume was teachers-catalog's stack's. Everything else
            # on it stops before ours can start: its old stack by name, then
            # anything left, whoever started it. A no-op once they are gone.
            docker compose -p students-cz stop -t 60
            ours=$(docker ps -q --filter 'name=^supervisor-telegram-catalog-postgres$')
            others=$(docker ps -q --filter volume=konnekt_postgres-data | grep -vx "${ours:-none}" || true)
            [ -z "$others" ] || printf '%s\n' "$others" | xargs docker stop -t 60

            # Personal data, on a host shared with other projects.
            install -d -m 700 catalog-backups db-backups

            # The catalog migrates, then derives its embeddings, before its new
            # API serves: a failed migration stops the deploy here.
            docker compose up -d --wait catalog-postgres
            if [ "$MIGRATE" = "true" ]; then
              docker compose run --rm -T catalog-migrate < /dev/null
              # The app's own, before bot or webapi is recreated: a failed
              # migration stops here with the old release still serving.
              docker compose run --rm -T migrate < /dev/null
            else
              echo "Migrations skipped by request."
            fi
            docker compose run --rm -T catalog-embed < /dev/null

            docker compose up -d --remove-orphans --wait --wait-timeout 180
            # Status only: this log is public, and what the services say names
            # users and chats. Read logs on the host.
            echo "--- Container status ---"
            docker compose ps

            # --- prune ---
            # This project's images only, and only once the new release is up:
            # the host is shared, and its other projects' images and build
            # cache are theirs to keep. 99 GB had piled up before this.
            keep="$IMAGE_TAG catalog-$IMAGE_TAG"
            [ -z "$PREVIOUS_TAG" ] || keep="$keep $PREVIOUS_TAG catalog-$PREVIOUS_TAG"
            stale=$(docker images --format '{{.Repository}}:{{.Tag}}' | while read -r ref; do
              case "$ref" in
                ghcr.io/vsem-azamat/supervisor-telegram:*|ghcr.io/vsem-azamat/supervisor-telegram-webui:*) ;;
                *) continue ;;
              esac
              case " $keep " in *" ${ref##*:} "*) continue ;; esac
              echo "$ref"
            done)
            # An image a container still uses is refused and the rest go on.
            # Through xargs: zsh passed the whole unquoted list to docker as
            # one argument, and the first prune removed nothing.
            removed=$([ -z "$stale" ] || printf '%s\n' "$stale" | xargs docker image rm 2>&1 | grep -c '^Untagged:' || true)
            echo "Removed ${removed:-0} old images of this project."
            # --- /prune ---
