# Configuration comes from the deploying shell, not from a file on the host.
# `deploy.yml` forwards GitHub secrets and variables over SSH, so the VPS holds
# no copy of anything sensitive and GitHub is the single source of truth.
#
# Bare names below mean "pass through from the environment". Anything absent
# here falls back to the default in `app/core/config.py` — so this list is only
# for values that genuinely differ between environments, not a second copy of
# every setting.
#
# There are no enable-flags here at all. A feature is on when it is configured:
# the control plane needs a token, and that token is also its switch. A flag
# that could disagree with the configuration it gates can only ever be wrong in
# one direction, and it is the direction that fails silently.
#
# Consequence worth knowing: `docker compose up` run by hand on the host, with
# none of this exported, recreates the containers without their configuration.
# DB_PASSWORD, MODERATOR_BOT_TOKEN and ADMIN_SUPER_ADMINS have no defaults and
# fail loudly at startup; the rest simply come up switched off. Redeploy through
# the workflow.
x-runtime-env: &runtime-env
  # The database is not part of this stack. It is on the shared PostgreSQL
  # server and holds the production data, so where it lives is deployment
  # configuration rather than something this file can state.
  DB_HOST:
  DB_PORT:
  DB_USER:
  DB_NAME:
  DB_PASSWORD:
  MODERATOR_BOT_TOKEN:
  ADMIN_SUPER_ADMINS:
  ADMIN_REPORT_CHAT_ID:
  WEBAPI_PUBLIC_URL:
  MCP_TOKEN:
  # Fixed here rather than passed in: they do not differ between deployments,
  # and one of them is what "production" means.
  APP_ENVIRONMENT: production
  LOG_LEVEL: INFO

# A dump a day at BACKUP_HOUR_UTC into /backups, kept BACKUP_RETENTION_DAYS,
# written to a .part file and renamed only once complete, so a partial file is
# never taken for a usable one. Credentials are the libpq PG* variables.
x-pg-backup-loop: &pg-backup-loop
      - |
        set -euo pipefail
        while true; do
          now=$$(date -u +%s)
          # Next occurrence of BACKUP_HOUR_UTC:00, today or tomorrow.
          target=$$(date -u -d "today $${BACKUP_HOUR_UTC}:00" +%s)
          [ "$$target" -le "$$now" ] && target=$$(date -u -d "tomorrow $${BACKUP_HOUR_UTC}:00" +%s)
          sleep $$((target - now))
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          if pg_dump --format=custom --file="/backups/$${BACKUP_PREFIX}-$$stamp.dump.part"; then
            # Renamed only once complete, so a partial file is never taken for
            # a usable backup.
            mv "/backups/$${BACKUP_PREFIX}-$$stamp.dump.part" "/backups/$${BACKUP_PREFIX}-$$stamp.dump"
            echo "backup ok: $${BACKUP_PREFIX}-$$stamp.dump"
          else
            rm -f "/backups/$${BACKUP_PREFIX}-$$stamp.dump.part"
            echo "backup FAILED at $$stamp" >&2
          fi
          # Only the top level: the directory may hold other dumps, kept by hand.
          find /backups -maxdepth 1 -name '*.dump' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
        done

# Logs rotated as the catalog's old stack rotated them.
x-rotated-logs: &rotated-logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  bot:
    image: ghcr.io/vsem-azamat/supervisor-telegram:${IMAGE_TAG:?Set IMAGE_TAG to a published image tag}
    container_name: supervisor-telegram-bot
    command: ["bot"]
    environment:
      <<: *runtime-env
      LOG_FILE_PATH: logs/bot.log
      # Only the bot process: the retired catalog bot answers from here.
      MODERATOR_BOT_RETIRED_TOKEN: ${MODERATOR_BOT_RETIRED_TOKEN:-}
    # The MCP control plane is served here rather than by webapi: Telegram
    # answers a confirmation button to the identity that sent it, and that
    # identity is this process. Loopback only — not published to the internet.
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - bot-logs:/app/logs
    restart: unless-stopped

  webapi:
    image: ghcr.io/vsem-azamat/supervisor-telegram:${IMAGE_TAG:?Set IMAGE_TAG to a published image tag}
    container_name: supervisor-telegram-webapi
    command: ["webapi"]
    environment:
      <<: *runtime-env
      # Separate file so the two processes do not interleave in one log.
      LOG_FILE_PATH: logs/webapi.log
    volumes:
      - bot-logs:/app/logs
    restart: unless-stopped

  webui:
    image: ghcr.io/vsem-azamat/supervisor-telegram-webui:${IMAGE_TAG:?Set IMAGE_TAG to a published image tag}
    container_name: supervisor-telegram-webui
    ports:
      - "127.0.0.1:18083:80"
    depends_on:
      - webapi
      - catalog-api
    restart: unless-stopped

  # The bot's database, moderator_prod, lives on the shared database server,
  # whose own backup jobs do not cover it. A dump a day lands here instead, on
  # another machine, with the credentials the bot runs with.
  db-backup:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: supervisor-telegram-db-backup
    environment:
      PGHOST: ${DB_HOST}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER}
      PGDATABASE: ${DB_NAME}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_PREFIX: moderator
      BACKUP_HOUR_UTC: 2
      BACKUP_RETENTION_DAYS: 30
    volumes:
      - ./db-backups:/backups
    entrypoint: ["/bin/bash", "-c"]
    command: *pg-backup-loop
    security_opt: [no-new-privileges:true]
    logging: *rotated-logs
    restart: unless-stopped

  # ── The catalog (catalog/) ─────────────────────────────────────────────
  # Its own database, image and settings: nothing but the bot token and the
  # admin ids is shared with the services above. See catalog/docs/deploy.md.

  catalog-postgres:
    # The schema needs pg_trgm, unaccent, btree_gist and vector. The exact
    # image the data was written by: the database collates with ICU (cs-CZ),
    # and another Debian base brings another ICU, whose text indexes then
    # need rebuilding.
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: supervisor-telegram-catalog-postgres
    environment:
      # Checked present by the deploy before it reaches the host.
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
      # Read only when the data directory is empty, which it is not; kept so
      # a rebuilt one sorts the same way. See catalog/docs/data-model.md.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=cs-CZ --encoding=UTF8"
    volumes:
      # /var/lib/postgresql, not .../data: Postgres 18 moved PGDATA.
      - catalog-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: [no-new-privileges:true]
    logging: *rotated-logs
    restart: unless-stopped

  # Run by the deploy with `compose run --rm` before the API starts, so a
  # failed migration stops the deployment instead of crash-looping the API.
  catalog-migrate:
    image: ghcr.io/vsem-azamat/supervisor-telegram:catalog-${IMAGE_TAG:?Set IMAGE_TAG to a published image tag}
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: &catalog-database postgresql+asyncpg://${CATALOG_DB_USER}:${CATALOG_DB_PASSWORD}@catalog-postgres:5432/${CATALOG_DB_NAME}
    depends_on:
      catalog-postgres: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    logging: *rotated-logs
    restart: "no"

  # Derived data: costs nothing when the catalog and the model are unchanged.
  catalog-embed:
    image: ghcr.io/vsem-azamat/supervisor-telegram:catalog-${IMAGE_TAG:?Set IMAGE_TAG to a published image tag}
    command: ["python", "-m", "students_cz.db.embed"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: *catalog-database
    depends_on:
      catalog-postgres: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    logging: *rotated-logs
    restart: "no"

  catalog-api:
    image: ghcr.io/vsem-azamat/supervisor-telegram:catalog-${IMAGE_TAG:?Set IMAGE_TAG to a published image tag}
    container_name: supervisor-telegram-catalog-api
    environment:
      DATABASE_URL: *catalog-database
      # The moderator bot's: the catalog sends through it and checks initData
      # with it, and never asks it for updates. See catalog/docs/deploy.md.
      BOT_TOKEN: ${MODERATOR_BOT_TOKEN}
      # Where the bot's buttons and the notifications open the app.
      PUBLIC_BASE_URL: ${WEBAPI_PUBLIC_URL}
      CORS_ORIGINS: '["${WEBAPI_PUBLIC_URL}"]'
      # The console's operators are the bot's super admins.
      ADMIN_TG_IDS: ${ADMIN_SUPER_ADMINS}
      # Empty means nobody is told when a profile or a request appears.
      OWNER_TG_ID: ${CATALOG_OWNER_TG_ID:-}
      ADS_CONTACT: ${CATALOG_ADS_CONTACT:-}
      # Never true here. It would let anyone claim to be anyone.
      ALLOW_UNSIGNED_INIT_DATA: "false"
      LOG_LEVEL: INFO
    depends_on:
      catalog-postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt: [no-new-privileges:true]
    logging: *rotated-logs
    restart: unless-stopped

  # A dump a day, kept for two weeks, beside the stack on the host. The
  # shared database server's backups do not cover this database.
  catalog-backup:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: supervisor-telegram-catalog-backup
    environment:
      PGHOST: catalog-postgres
      PGDATABASE: ${CATALOG_DB_NAME}
      PGUSER: ${CATALOG_DB_USER}
      PGPASSWORD: ${CATALOG_DB_PASSWORD}
      BACKUP_PREFIX: catalog
      BACKUP_HOUR_UTC: 3
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - ./catalog-backups:/backups
    depends_on:
      catalog-postgres: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command: *pg-backup-loop
    security_opt: [no-new-privileges:true]
    logging: *rotated-logs
    restart: unless-stopped

volumes:
  bot-logs:
  # The catalog's data, in the volume its old stack (teachers-catalog,
  # compose project `konnekt`, later `students-cz`) created. External and
  # named, because a compose volume is `<project>_<name>` and any other
  # declaration would be a new, empty database.
  catalog-postgres-data:
    external: true
    name: konnekt_postgres-data
