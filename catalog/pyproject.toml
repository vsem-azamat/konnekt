[project]
name = "students-cz-api"
version = "0.1.0"
description = "Students CZ — student help catalog for the Czech Republic: API and Telegram bot"
requires-python = ">=3.13"
dependencies = [
    # Babel comes with the i18n extra; the bot and the API share one catalog.
    "aiogram[i18n]>=3.30,<4",
    "alembic>=1.18",
    "asyncpg>=0.31",
    # 0.132 rejects JSON bodies without a proper Content-Type, 0.138 added
    # app.frontend() for serving the mini app's build output.
    "fastapi>=0.140",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "pgvector>=0.5.0",
    "prometheus-client>=0.25,<1",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0.51",
    "tokenizers>=0.23.1",
    "uvicorn[standard]>=0.51",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "ty>=0.0.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/students_cz"]

[tool.ruff]
target-version = "py313"
line-length = 90
src = ["src"]
# Migration bodies are generated by Alembic; reformatting them creates
# diff noise and hides the one thing worth reviewing — the hand edits.
extend-exclude = ["src/students_cz/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Czech and Russian appear throughout the domain vocabulary and the
# comments explaining it; the confusable-character rules fire on every
# one of them and have nothing to say about correctness here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# Calling Query/Depends/Header in a default is how FastAPI declares parameters;
# B008 exists for mutable defaults and does not apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

# Its own, so ty does not climb to the repository root and take the bot's
# project for this one: there it indexes nothing here and passes.
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
