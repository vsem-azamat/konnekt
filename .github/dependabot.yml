# Monthly, grouped: one pull request per ecosystem a month rather than one per
# package a week, so updates arrive at a pace somebody reviews and CI is spent
# once. Security updates come apart from these as soon as an advisory is
# published, whatever the schedule.
version: 2
updates:
  # Both Python projects in one group: they must lock the same aiogram
  # (tests/webapi/test_init_data_agrees_with_aiogram.py), and two groups bumped
  # it in one and not the other.
  - package-ecosystem: uv
    directories: ["/", "/catalog"]
    schedule: {interval: monthly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: monthly}
    groups:
      web: {patterns: ["*"]}
    # TypeScript 7 drops the compiler API that @hey-api/openapi-ts (api:generate)
    # is built on; lift this once openapi-ts supports it.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
  # Actions are pinned to commits (#191); this keeps the pins moving.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
