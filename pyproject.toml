[project]
name = "moderator-bot"
version = "0.1.0"
description = "Telegram bot for moderating educational chats."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiogram>=3.30",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "python-dotenv",
    "structlog>=23.2",
    "httpx>=0.27",
    "telegramify-markdown>=1.1,<2",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "fastmcp>=3.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
src = ["app", "tests"]
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long
    "S101",  # use of assert
    "T201",  # print found
    "B008",  # function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"app/webapi/**" = [
    "TC001",  # FastAPI/Pydantic need runtime type annotations for DI and validation
    "TC002",
    "TC003",
]
"tests/**" = [
    "ARG001",  # unused function arguments (common in tests/fixtures)
    "ARG002",  # unused method arguments (common in test methods)
    "S311",    # pseudo-random generators (acceptable in tests)
    "SIM117",  # nested with statements (common in test assertions)
    "E402",    # module level import not at top (pytest fixtures)
    "N815",    # mixed case variable name (test data)
    "N802",    # camelCase method names (matching Telegram API methods in fakes)
    "N806",    # uppercase variable names in functions (test constants)
    "S106",    # hardcoded passwords (test tokens)
    "S110",    # try-except-pass (docker availability check)
    "PLR2004", # magic value used in comparison
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── ty type checker (replaces mypy) ──────────────────────────────────
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["app", "tests"]
exclude = ["alembic/**"]

# The rules below deliberately demote whole families to "warn" — mock types in
# tests, stubs a third party never shipped. Demoting them only means anything
# if a warning does not then fail the build, which is how ty behaved until
# 0.0.66 started exiting non-zero on them. Errors still fail.
[tool.ty.terminal]
error-on-warning = false

[tool.ty.rules]
# Third-party stubs often missing or incomplete
unresolved-import = "warn"

[tool.ty.analysis]
# Telethon, burr, feedparser, pydantic-ai lack complete stubs
replace-imports-with-any = [
    "telethon.**",
    "testcontainers.**",
]

# Presentation layer — aiogram Message | InaccessibleMessage union patterns
[[tool.ty.overrides]]
include = ["app/presentation/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "warn"        # callback.message.edit_text on union type

# Core — DI container generic patterns, Pydantic config
[[tool.ty.overrides]]
include = ["app/core/**"]

[tool.ty.overrides.rules]
invalid-return-type = "warn"         # generic container return patterns
invalid-argument-type = "warn"       # Pydantic Field patterns

# Tests — relaxed checking for mocks, fixtures, test data
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"       # mock/fixture type mismatches
invalid-assignment = "warn"          # AsyncMock replacing concrete async methods
unresolved-attribute = "warn"        # mock object dynamic attributes
invalid-return-type = "warn"         # test helpers
no-matching-overload = "warn"        # mock constructor patterns
call-non-callable = "warn"           # mocked object callable patterns

[dependency-groups]
dev = [
    # Only the maintenance scripts under `scripts/` talk to the Telegram client
    # API, and they run from a developer's machine against a session that lives
    # there. Nothing the deployed application does needs it, and a runtime
    # dependency on it is a dependency on somebody being logged in.
    "telethon>=1.42.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "aiosqlite>=0.20",
    "ruff>=0.12.4",
    "ty>=0.0.23",
    "pre-commit>=3.6",
    "watchfiles>=0.21",
    "psutil",
    "testcontainers[postgres]>=4.14.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    # Used since these suites were written; pytest 9.1 is the first version to
    # notice they were never declared here, and --strict-markers refuses to
    # collect them.
    "handlers: marks tests covering Telegram handlers",
    "middleware: marks tests covering aiogram middleware",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer hands off to a greenlet, and without this the tracer
# loses the frame there: every line after an awaited query in the same function
# is reported as unrun even when it demonstrably executes. Worth ~3 points of
# project coverage, and it made whole handler bodies look untested.
concurrency = ["greenlet"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__main__.py",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
# Near the real figure (88 % on 2026-10-19), so a change that drops
# coverage noticeably fails rather than hiding under a floor nobody reaches.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
