name: Tests

on:
  workflow_call:
  pull_request:
    branches: [ main ]
    # ready_for_review: a draft runs no lane until it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_moderator_bot
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: test_moderator_bot
      DB_HOST: localhost
      DB_PORT: 5432
      MODERATOR_BOT_TOKEN: "test_token"
      ADMIN_SUPER_ADMINS: "123456789"

    # Matrix kept (even though single-versioned) so the required-status-check
    # rule `test (3.12)` keeps matching.
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # A pull request's merge commit and main under it: what it changes.
        fetch-depth: 2

    # A pull request runs only the steps its change can break; main, and so
    # the deploy, runs all of them. The hooks read the same script. The job
    # itself always runs: branch protection waits for it by name.
    - name: Lanes this change touches
      id: lanes
      env:
        DRAFT: ${{ github.event.pull_request.draft }}
      run: |
        if [ "$DRAFT" = true ]; then
          lanes=$(printf 'python=false\nweb=false\ncatalog=false')
        elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          lanes=$(.githooks/lanes HEAD^1 HEAD)
        else
          lanes=$(printf 'python=true\nweb=true\ncatalog=true')
        fi
        echo "$lanes"
        # Anything else leaves a step's condition empty, and the step skipped.
        names=$(grep -xE '(python|web|catalog)=(true|false)' <<<"$lanes" | cut -d= -f1 | sort | paste -sd, -)
        if [ "$names" != catalog,python,web ] || [ "$(wc -l <<<"$lanes")" -ne 3 ]; then
          echo "lanes printed something other than the three lanes" >&2
          exit 1
        fi
        echo "$lanes" >> "$GITHUB_OUTPUT"

    - name: Set up Python ${{ matrix.python-version }}
      if: steps.lanes.outputs.python == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      if: steps.lanes.outputs.python == 'true'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.11.33"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      if: steps.lanes.outputs.python == 'true'
      run: uv sync --dev

    # The deploy script runs in the deploy user's login shell, zsh, and the
    # deploy tests run it there too.
    - name: Install zsh
      if: steps.lanes.outputs.python == 'true'
      run: sudo apt-get install -y --no-install-recommends zsh

    - name: Lint + format check (ruff)
      if: steps.lanes.outputs.python == 'true'
      run: |
        uv run ruff check app tests scripts
        uv run ruff format --check app tests scripts

    - name: Type check (ty)
      if: steps.lanes.outputs.python == 'true'
      run: uv run ty check app tests

    # The tests build their schema with create_all, so only this proves the
    # migration history: production applies it on every deploy. A database of
    # its own, so the tests' schema and this one never meet.
    - name: Migrations apply, and agree with the models
      if: steps.lanes.outputs.python == 'true'
      env:
        DB_NAME: migrations_check
        PGPASSWORD: ${{ env.DB_PASSWORD }}
      run: |
        psql -h localhost -U postgres -d postgres -c 'create database migrations_check'
        uv run alembic upgrade head
        uv run alembic check

    # Single pytest invocation covering all suites with coverage. Pytest
    # auto-discovers from testpaths=["tests"] (unit + integration + e2e +
    # handlers + middleware + performance). Previously each suite ran
    # separately AND the full run was repeated with --cov, duplicating
    # ~1.5 min of work.
    - name: Pytest with coverage
      if: steps.lanes.outputs.python == 'true'
      # The floor lives in pyproject.toml ([tool.coverage.report] fail_under).
      run: uv run pytest --cov=app --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: success() && steps.lanes.outputs.python == 'true'
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage reports as artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && steps.lanes.outputs.python == 'true'
      with:
        name: coverage-reports
        path: htmlcov/

    - name: Set up Node.js
      if: steps.lanes.outputs.web == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.15.0"

    # Corepack picks the pnpm the Mini App's package.json names (11), which is
    # why each step below runs in web/.
    - name: Set up pnpm
      if: steps.lanes.outputs.web == 'true'
      run: corepack enable

    - name: Install web dependencies
      if: steps.lanes.outputs.web == 'true'
      working-directory: web
      run: pnpm install --frozen-lockfile

    - name: Lint web
      if: steps.lanes.outputs.web == 'true'
      working-directory: web
      run: pnpm lint

    - name: Type check web
      if: steps.lanes.outputs.web == 'true'
      working-directory: web
      run: pnpm typecheck

    - name: Test web
      if: steps.lanes.outputs.web == 'true'
      working-directory: web
      run: pnpm test

    # A message used in code but missing from a catalog renders as its Russian
    # source in the other three languages, silently. compile reads only the
    # catalogs, so extract first and fail when that changes them. Never
    # --clean: it drops the obsolete entries the catalogs keep on purpose.
    - name: Every web message is translated
      if: steps.lanes.outputs.web == 'true'
      working-directory: web
      run: |
        pnpm exec lingui extract
        changed=$(git status --porcelain -- src/locales)
        if [ -n "$changed" ]; then
          echo "$changed"
          echo "Run \`pnpm i18n:extract\` in web/, translate, and commit." >&2
          exit 1
        fi
        pnpm exec lingui compile --strict

    # The client in web/src/lib/generated is generated from the catalog API's
    # document, catalog/openapi.json, which the catalog job checks against the
    # API itself. Regenerating must change nothing.
    - name: The web client matches the catalog API's contract
      if: steps.lanes.outputs.web == 'true'
      working-directory: web
      run: |
        pnpm api:generate
        changed=$(git status --porcelain -- src/lib/generated)
        if [ -n "$changed" ]; then
          echo "$changed"
          echo "Run \`pnpm api:generate\` in web/ and commit src/lib/generated." >&2
          exit 1
        fi

    - name: Build web
      if: steps.lanes.outputs.web == 'true'
      working-directory: web
      run: pnpm build

    # The layout on Telegram's Android and iOS viewports, where the height
    # Telegram reports and the window's differ. The development mock is a
    # desktop client and cannot show that, so the other layout checks miss it.
    # The browser is kept between runs, keyed by the Playwright that wants it;
    # the install below then only adds the system libraries it needs.
    - name: Find the Playwright version
      if: steps.lanes.outputs.web == 'true'
      id: playwright
      working-directory: web
      run: |
        version=$(pnpm exec playwright --version | awk '{print $2}')
        [ -n "$version" ] || { echo "playwright --version printed no version" >&2; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache the browser for the layout check
      if: steps.lanes.outputs.web == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install the browser for the layout check
      if: steps.lanes.outputs.web == 'true'
      working-directory: web
      run: pnpm exec playwright install --with-deps chromium

    - name: The Mini App lays out inside what Telegram shows
      if: steps.lanes.outputs.web == 'true'
      working-directory: web
      timeout-minutes: 10
      run: pnpm check:devices

    - name: Each path goes to the backend or build that owns it
      run: |
        set -euo pipefail
        docker run --rm -e ADMIN_HOST=admin.example.test \
          -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
          caddy:2.11.2-alpine caddy adapt --config /etc/caddy/Caddyfile \
          | python3 docker/check-routes.py

  # The catalog (catalog/): its own Python project, lockfile and database.
  # A separate job because nothing is shared with the bot's but the runner.
  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog

    services:
      postgres:
        # The schema needs pg_trgm, unaccent, btree_gist and vector, and the
        # tests exercise them all. Pinned like the bot's.
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_USER: students_cz
          POSTGRES_PASSWORD: students_cz
          POSTGRES_DB: students_cz
          # As production's data directory was created: Czech names sort by ICU
          # cs-CZ there, and a test of sorting is only worth what it collates.
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=cs-CZ --encoding=UTF8"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U students_cz -d students_cz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5433
      # No bot token in CI, and the API tests need to authenticate somehow.
      # Signature handling is covered separately, against real HMAC.
      BOT_TOKEN: ''
      ALLOW_UNSIGNED_INIT_DATA: 'true'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # A pull request's merge commit and main under it: what it changes.
        fetch-depth: 2

    # As in the test job.
    - name: Lanes this change touches
      id: lanes
      env:
        DRAFT: ${{ github.event.pull_request.draft }}
      run: |
        if [ "$DRAFT" = true ]; then
          lanes=$(printf 'python=false\nweb=false\ncatalog=false')
        elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          lanes=$(../.githooks/lanes HEAD^1 HEAD)
        else
          lanes=$(printf 'python=true\nweb=true\ncatalog=true')
        fi
        echo "$lanes"
        # Anything else leaves a step's condition empty, and the step skipped.
        names=$(grep -xE '(python|web|catalog)=(true|false)' <<<"$lanes" | cut -d= -f1 | sort | paste -sd, -)
        if [ "$names" != catalog,python,web ] || [ "$(wc -l <<<"$lanes")" -ne 3 ]; then
          echo "lanes printed something other than the three lanes" >&2
          exit 1
        fi
        echo "$lanes" >> "$GITHUB_OUTPUT"

    - name: Install uv
      if: steps.lanes.outputs.catalog == 'true'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.11.33"
        enable-cache: true
        cache-dependency-glob: "catalog/uv.lock"

    - name: Install dependencies
      if: steps.lanes.outputs.catalog == 'true'
      run: uv sync --locked

    - name: Lint
      if: steps.lanes.outputs.catalog == 'true'
      run: |
        uv run ruff check src tests
        uv run ruff format --check src tests

    - name: Type-check
      if: steps.lanes.outputs.catalog == 'true'
      run: uv run ty check src tests

    - name: Migrate
      if: steps.lanes.outputs.catalog == 'true'
      run: uv run alembic upgrade head

    # A model changed without a migration passes every test and then fails on
    # deploy. This is the only place that catches it.
    - name: The models and the migrations agree
      if: steps.lanes.outputs.catalog == 'true'
      run: uv run alembic check

    # The tests match against real subjects and institutions, because the
    # matching is the logic: «матан» has to reach calculus.
    - name: Seed reference data
      if: steps.lanes.outputs.catalog == 'true'
      run: |
        uv run python -m students_cz.db.seed
        uv run python -m students_cz.db.demo

    - name: Test
      if: steps.lanes.outputs.catalog == 'true'
      run: uv run pytest -q

    # catalog/openapi.json is what web/ generates its client from, and the
    # test job checks that client against it. Declared at import time, so no
    # database and no server.
    - name: The committed OpenAPI document matches the API
      if: steps.lanes.outputs.catalog == 'true'
      run: |
        set -euo pipefail
        PYTHONIOENCODING=utf-8 uv run python -m students_cz.openapi > "$RUNNER_TEMP/openapi.json"
        grep -q '"openapi"' "$RUNNER_TEMP/openapi.json"
        diff -u openapi.json "$RUNNER_TEMP/openapi.json" || {
          echo "Run \`make contract\` in catalog/ and commit openapi.json." >&2
          exit 1
        }
